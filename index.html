<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registratie App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>Registratie App</h1>
            <div class="header-buttons">
                <button id="resetBtn" class="btn btn-secondary">Reset Data</button>
                <label for="csvFileInput" class="btn btn-secondary" style="cursor:pointer">Import CSV</label>
                <input type="file" id="csvFileInput" accept=".csv,.txt" style="display:none">
                <button id="addRowBtn" class="btn btn-primary">+ Nieuw Record</button>
            </div>
        </header>

        <div class="table-wrapper">
            <table id="registrationTable">
                <thead>
                    <tr id="headerRow">
                        <th data-key="regNummer">Reg. Nr. <span class="sort-arrow"></span></th>
                        <th data-key="woNummer">WO-nr. <span class="sort-arrow"></span></th>
                        <th data-key="waar">Waar <span class="sort-arrow"></span></th>
                        <th data-key="monteur">Monteur <span class="sort-arrow"></span></th>
                        <th data-key="datumAanvang">Aanvang <span class="sort-arrow"></span></th>
                        <th data-key="datumEind">Eind <span class="sort-arrow"></span></th>
                        <th data-key="uitgevoerd">Uitg. <span class="sort-arrow"></span></th>
                        <th data-key="afgemeld">Afg. <span class="sort-arrow"></span></th>
                        <th data-key="referentie">Ref. <span class="sort-arrow"></span></th>
                        <th data-key="archiefGevuld">Archief <span class="sort-arrow"></span></th>
                        <th data-key="vervolg">Vervolg <span class="sort-arrow"></span></th>
                        <th data-key="opmerking">Opmerking <span class="sort-arrow"></span></th>
                        <th>Acties</th>
                    </tr>
                    <tr id="filterRow">
                        <th><input type="text" class="filter-input" data-key="regNummer" placeholder="Filter..."></th>
                        <th><input type="text" class="filter-input" data-key="woNummer" placeholder="Filter..."></th>
                        <th><input type="text" class="filter-input" data-key="waar" placeholder="Filter..."></th>
                        <th><input type="text" class="filter-input" data-key="monteur" placeholder="Filter..."></th>
                        <th><input type="text" class="filter-input" data-key="datumAanvang" placeholder="Filter..."></th>
                        <th><input type="text" class="filter-input" data-key="datumEind" placeholder="Filter..."></th>
                        <th>
                            <select class="filter-select" data-key="uitgevoerd">
                                <option value="">Alle</option>
                                <option value="Nee">Nee</option>
                                <option value="Bezig">Bezig</option>
                                <option value="Ja">Ja</option>
                                <option value="Vervallen">Vervallen</option>
                            </select>
                        </th>
                        <th>
                            <select class="filter-select" data-key="afgemeld">
                                <option value="">Alle</option>
                                <option value="Nee">Nee</option>
                                <option value="Ja">Ja</option>
                            </select>
                        </th>
                        <th>
                            <select class="filter-select" data-key="referentie">
                                <option value="">Alle</option>
                                <option value="Nee">Nee</option>
                                <option value="Ingevuld, nakijken">Ingevuld, nakijken</option>
                                <option value="Ja">Ja</option>
                                <option value="Onnodig">Onnodig</option>
                            </select>
                        </th>
                        <th>
                            <select class="filter-select" data-key="archiefGevuld">
                                <option value="">Alle</option>
                                <option value="Ja">Ja</option>
                                <option value="Nee">Nee</option>
                                <option value="Onvolledig">Onvolledig</option>
                            </select>
                        </th>
                        <th>
                            <select class="filter-select" data-key="vervolg">
                                <option value="">Alle</option>
                                <option value="Nee">Nee</option>
                                <option value="Gepland">Gepland</option>
                                <option value="Ja">Ja</option>
                                <option value="Onbekend">Onbekend</option>
                            </select>
                        </th>
                        <th><input type="text" class="filter-input" data-key="opmerking" placeholder="Filter..."></th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>

        <div class="table-footer">
            <span id="rowCount">0 records</span>
        </div>
    </div>

    <!-- Modal for adding/editing records -->
    <div id="modal" class="modal hidden">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <h2 id="modalTitle">Nieuw Record</h2>
            <form id="recordForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="regNummer">Reg. Nummer</label>
                        <div class="prefix-input">
                            <span class="input-prefix">460265</span>
                            <input type="text" id="regNummer" maxlength="4" pattern="\d{4}" placeholder="0000" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="woNummer">WO-nummer</label>
                        <div class="prefix-input">
                            <span class="input-prefix">460260</span>
                            <input type="text" id="woNummer" maxlength="4" pattern="\d{4}" placeholder="0000" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="waar">Waar</label>
                        <input type="text" id="waar">
                    </div>
                    <div class="form-group">
                        <label for="monteur">Monteur</label>
                        <select id="monteur">
                            <option value="">-- Kies monteur --</option>
                            <option value="Amadeusz">Amadeusz</option>
                            <option value="Devin">Devin</option>
                            <option value="Dimitri">Dimitri</option>
                            <option value="Dylan">Dylan</option>
                            <option value="Ferry">Ferry</option>
                            <option value="Jayden">Jayden</option>
                            <option value="Johan">Johan</option>
                            <option value="Kevin">Kevin</option>
                            <option value="Koen">Koen</option>
                            <option value="Leendert">Leendert</option>
                            <option value="Michel">Michel</option>
                            <option value="Mohammed">Mohammed</option>
                            <option value="Richaino">Richaino</option>
                            <option value="Robert-Jan">Robert-Jan</option>
                            <option value="Rowan">Rowan</option>
                            <option value="Storm">Storm</option>
                            <option value="Tomasz">Tomasz</option>
                            <option value="Willem">Willem</option>
                            <option value="Yoni">Yoni</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="datumAanvang">Datum Aanvang</label>
                        <input type="date" id="datumAanvang">
                    </div>
                    <div class="form-group">
                        <label for="datumEind">Datum Eind</label>
                        <input type="date" id="datumEind">
                    </div>
                    <div class="form-group">
                        <label for="uitgevoerd">Uitgevoerd</label>
                        <select id="uitgevoerd">
                            <option value="Nee">Nee</option>
                            <option value="Bezig">Bezig</option>
                            <option value="Ja">Ja</option>
                            <option value="Vervallen">Vervallen</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="afgemeld">Afgemeld</label>
                        <select id="afgemeld">
                            <option value="Nee">Nee</option>
                            <option value="Ja">Ja</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="referentie">Referentie</label>
                        <select id="referentie">
                            <option value="Nee">Nee</option>
                            <option value="Ja">Ja</option>
                            <option value="Onnodig">Onnodig</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="archiefGevuld">Archief gevuld</label>
                        <select id="archiefGevuld">
                            <option value="Ja">Ja</option>
                            <option value="Onvolledig">Onvolledig</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="vervolg">Vervolg</label>
                        <select id="vervolg">
                            <option value="Nee">Nee</option>
                            <option value="Gepland">Gepland</option>
                            <option value="Ja">Ja</option>
                            <option value="Onbekend">Onbekend</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label for="opmerking">Opmerking</label>
                        <textarea id="opmerking" rows="3"></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" id="cancelBtn" class="btn btn-secondary">Annuleren</button>
                    <button type="submit" class="btn btn-primary">Opslaan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
